<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GIF 메이커 — DNRB 워크스페이스</title>
<link rel="icon" href="../icons/favicon-64.png">
<script src="../config.js"></script>
<script src="gm-ws.js?v=1"></script>
<style>
/* GIF 메이커(워크스페이스 내장) 틀 — 위에 도구 탭, 아래에 도구 화면.
   도구 화면(iframe)은 처음 열 때 한 번만 만들고 계속 둔다 → 탭을 옮겨도 올려 둔 사진·편집 중인 내용이 남는다. */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: #f0efe9; color: #1a1816; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
.bar { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e8e6df; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -.2px; white-space: nowrap; }
.brand i { width: 28px; height: 28px; border-radius: 8px; background: #e8500a; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 6px; }
.brand i b { background: #fff; border-radius: 1.5px; }
.brand i b:nth-child(2), .brand i b:nth-child(3) { opacity: .7; } .brand i b:nth-child(4) { opacity: .5; }
.tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: none; background: none; font: inherit; font-size: 12.5px; font-weight: 500; color: #6b6660; padding: 7px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.tab:hover { background: #f2f0ec; color: #1a1816; }
.tab[aria-selected="true"] { background: #1a1816; color: #fff; font-weight: 600; }
.tab:focus-visible, .act:focus-visible { outline: 2px solid #e8500a; outline-offset: 2px; }
.right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; font-size: 12px; color: #6b6660; white-space: nowrap; }
.act { border: 1px solid #d9d6cf; background: #fff; border-radius: 8px; font: inherit; font-size: 12px; font-weight: 600; color: #1a1816; padding: 6px 10px; cursor: pointer; text-decoration: none; }
.act:hover { border-color: #1a1816; }
.frames { flex: 1; min-height: 0; position: relative; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f0efe9; }
.frames iframe.off { visibility: hidden; pointer-events: none; }
body.embed .brand, body.embed #who { display: none; }
body.embed .bar { padding: 6px 10px; }
@media (max-width: 720px) { .bar { flex-wrap: wrap; gap: 6px; padding: 8px 10px; } .tabs { order: 3; flex-basis: 100%; } .tab { flex: 1; text-align: center; padding: 8px 6px; } #who { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i>GIF 메이커</div>
  <div class="tabs" role="tablist" aria-label="도구" id="tabs"></div>
  <div class="right">
    <span id="who"></span>
    <a class="act" id="popBtn" href="app.html" target="dnrb_gif" rel="noopener" title="새 창에서 화면을 넓게 써요" hidden>새 창으로 크게 보기 ↗</a>
    <a class="act" id="homeBtn" href="../" hidden>워크스페이스</a>
  </div>
</div>
<div class="frames" id="frames"></div>
<script>
(function () {
  'use strict';
  if (window.GMWS.blocked) return;
  var TOOLS = [
    { key: 'gif', label: 'GIF 만들기', src: 'gif-maker-standalone.html?pro=1' },
    { key: 'resize', label: '사진 리사이즈', src: 'image-resizer-standalone.html' },
    { key: 'projects', label: '프로젝트', src: 'projects-standalone.html' },
    { key: 'cardnews', label: '카드뉴스', src: 'cardnews-standalone.html' },
    { key: 'banner', label: '배너', src: 'banner-standalone.html' },
  ];
  // 도구 화면 안의 링크(예: "프로젝트 열기")가 보내는 주소 → 탭
  var NAV = { '/app': 'gif', '/app/resize': 'resize', '/app/projects': 'projects', '/app/cardnews': 'cardnews', '/app/banner': 'banner' };
  var embedded = window.top !== window.self;
  document.body.classList.toggle('embed', embedded);
  document.getElementById(embedded ? 'popBtn' : 'homeBtn').hidden = false;
  var s = window.GMWS.session();
  document.getElementById('who').textContent = s ? s.name : '';

  var tabs = document.getElementById('tabs'), frames = document.getElementById('frames');
  var made = {}, active = null;
  TOOLS.forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.textContent = t.label; b.dataset.key = t.key;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', 'false');
    b.onclick = function () { show(t.key, true); };
    tabs.appendChild(b);
  });
  function show(key, push) {
    var t = TOOLS.filter(function (x) { return x.key === key; })[0] || TOOLS[0];
    if (active === t.key) return;
    active = t.key;
    if (!made[t.key]) {
      var f = document.createElement('iframe');
      f.title = t.label; f.src = t.src; f.dataset.key = t.key;
      frames.appendChild(f);
      made[t.key] = f;
    } else if (t.key === 'projects' || t.key === 'cardnews') {
      // 돌아오면 그 사이 저장된 프로젝트·템플릿을 다시 읽게 한다
      try { made[t.key].contentWindow.postMessage({ type: 'gm_show' }, location.origin); } catch (e) {}
    }
    Object.keys(made).forEach(function (k) {
      var on = k === t.key;
      made[k].classList.toggle('off', !on);
      made[k].tabIndex = on ? 0 : -1;
      made[k].setAttribute('aria-hidden', on ? 'false' : 'true');
    });
    Array.prototype.forEach.call(tabs.children, function (b) { b.setAttribute('aria-selected', b.dataset.key === t.key ? 'true' : 'false'); });
    if (push) { try { history.replaceState(null, '', '#' + t.key); } catch (e) {} }
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'gm_nav' && NAV[e.data.href]) show(NAV[e.data.href], true);
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1) || 'gif', false);
})();
</script>
</body>
</html>
