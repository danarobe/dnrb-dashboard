# Supabase 프로젝트 설정 (Edge Functions)

# 카페24 OAuth 콜백은 카페24 서버가 브라우저 리다이렉트로 호출하므로
# JWT 검증을 끈다 (Authorization 헤더를 붙일 수 없음)
[functions.cafe24-oauth]
verify_jwt = false

# 아래 두 함수는 대시보드에서 anon key와 함께 호출 (JWT 검증 유지)
[functions.cafe24-claims]
verify_jwt = true

[functions.naver-claims]
verify_jwt = true

[functions.cafe24-analytics]
verify_jwt = true

[functions.auth]
verify_jwt = true

# 아카이브·회의록 테이블 프록시 (anon 정책 제거 후 유일한 접근 경로)
[functions.db]
verify_jwt = true

# Meta 광고관리자 연동 (관리자 전용)
[functions.meta-ads]
verify_jwt = true

# 근무관리 — 관리자 전용 (급여·직원·출퇴근·휴가·기기)
[functions.wm-admin]
verify_jwt = true

# 근무관리 키오스크 — 기기 토큰 + PIN 세션 (anon key는 인증 아님)
[functions.wm-kiosk]
verify_jwt = true

# 알바 채용·면접비 — 관리자 + 물류팀 (주민번호·계좌 암호화 저장, 2026-10-12 이식)
[functions.wm-hire]
verify_jwt = true

# 업로드 캘린더 — 상품관리 시스템 캘린더를 읽기 전용으로 (관리자·MD·물류팀, 2026-10-23)
[functions.npm-calendar]
verify_jwt = true

# 상품 등록 전용 카페24 앱(2026-11-25) — 카페24 리다이렉트를 받으므로 JWT 검증 끔(함수가 직접 로그인·서명 검사)
[functions.cafe24-product]
verify_jwt = false

# GIF 메이커(워크스페이스 내장, 2026-11-26) — 관리자 + MD/컨텐츠. 프로젝트·템플릿·상세 사진·구글 드라이브 지정 폴더
[functions.gif]
verify_jwt = true
